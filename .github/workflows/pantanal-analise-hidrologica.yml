name: Pantanal - analise hidrologica estatistica
on:
  push:
    branches: [pesquisa-pantanal-extracao-2026]
    paths:
      - 'pesquisa_pantanal/hidrologia/resultados/agua_chuva_mensal_caceres_1985_2025.csv'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analisar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Estatistica e graficos cientificos
        run: |
          python -m pip install --quiet numpy pandas scipy statsmodels matplotlib
          python pesquisa_pantanal/hidrologia/analisar_series.py
      - name: Publicar somente resultados na branch de pesquisa
        run: |
          git config user.name "pantanal-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pesquisa_pantanal/hidrologia/analise/
          if ! git diff --cached --quiet; then
            git commit -m "Resultados mensais chuva cota vazao agua com lags e IC95"
            git push origin HEAD:pesquisa-pantanal-extracao-2026
          fi
