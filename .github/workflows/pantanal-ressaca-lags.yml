name: Pantanal - defasagens em hotspot Ressaca
on:
  push:
    branches: [pesquisa-pantanal-extracao-2026]
    paths:
      - 'pesquisa_pantanal/fazenda_ressaca/testar_lags.py'
      - '.github/workflows/pantanal-ressaca-lags.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Estatística gratuita
        run: python -m pip install --quiet numpy pandas scipy statsmodels matplotlib
      - name: Testar efeitos de pastagem e 41 anos de água
        run: python pesquisa_pantanal/fazenda_ressaca/testar_lags.py
      - name: Publicar gráficos e tabelas
        if: always()
        run: |
          git config user.name "pantanal-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pesquisa_pantanal/fazenda_ressaca/resultados/*HOTSPOT*.csv || true
          git add -f pesquisa_pantanal/fazenda_ressaca/resultados/*RESSACA*.png || true
          git add -f pesquisa_pantanal/fazenda_ressaca/resultados/RESUMO_RESULTADOS_HOTSPOT.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Resultado piloto de defasagens e mapas de conversao pixel temporal"
            git pull --rebase origin pesquisa-pantanal-extracao-2026
            git push origin HEAD:pesquisa-pantanal-extracao-2026
          fi
