name: Pantanal - medir vazoes das cabeceiras
on:
  push:
    branches: [pesquisa-pantanal-extracao-2026]
    paths:
      - 'pesquisa_pantanal/cabeceiras/prospectar_vazoes.py'
      - '.github/workflows/pantanal-cabeceiras-vazoes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vazoes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar bibliotecas
        run: python -m pip install --quiet requests numpy scipy
      - name: Recuperar vazoes históricas da ANA
        run: python pesquisa_pantanal/cabeceiras/prospectar_vazoes.py
      - name: Salvar dados de cabeceiras sem alterar site publicado
        if: always()
        run: |
          git config user.name "pantanal-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pesquisa_pantanal/cabeceiras/resultados/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Dados ANA cabeceiras e indicadores de vazao 1985-2025"
            git pull --rebase origin pesquisa-pantanal-extracao-2026
            git push origin HEAD:pesquisa-pantanal-extracao-2026
          fi
