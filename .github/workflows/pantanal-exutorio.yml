name: Pantanal - auditoria exutorio 66070004
on:
  push:
    branches: [pesquisa-pantanal-extracao-2026]
    paths:
      - 'pesquisa_pantanal/recorte_cientifico/diagnosticar_exutorio.py'
      - '.github/workflows/pantanal-exutorio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet earthengine-api
      - name: Consultar pontos publicados e niveis HydroBASINS
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          EE_PROJECT: ${{ vars.EE_PROJECT }}
        run: python pesquisa_pantanal/recorte_cientifico/diagnosticar_exutorio.py
      - name: Salvar auditoria no ramo isolado
        if: always()
        run: |
          git config user.name "pantanal-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pesquisa_pantanal/recorte_cientifico/resultados/diagnostico_exutorio_niveis_6_10.json
          if ! git diff --cached --quiet; then
            git commit -m "Diagnostico de area contribuinte da estacao ANA Caceres"
            git push origin HEAD:pesquisa-pantanal-extracao-2026
          fi
