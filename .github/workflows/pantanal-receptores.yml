name: Pantanal - selecionar receptores D8 e controles
on:
  push:
    branches: [pesquisa-pantanal-extracao-2026]
    paths:
      - 'pesquisa_pantanal/fazenda_ressaca/selecionar_receptores.py'
      - '.github/workflows/pantanal-receptores.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  selecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências
        run: python -m pip install --quiet pandas shapely pyproj
      - name: Seleção georreferenciada
        run: python pesquisa_pantanal/fazenda_ressaca/selecionar_receptores.py
      - name: Salvar candidatos e notas de qualidade
        if: always()
        run: |
          git config user.name "pantanal-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pesquisa_pantanal/fazenda_ressaca/jusante/CANDIDATOS_RECEPTORES_CONTROLE.json || true
          git add -f pesquisa_pantanal/fazenda_ressaca/jusante/GRADE_RECEPTORES_MERIT.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "Células receptoras candidatas e controles com MERIT D8"
            git pull --rebase origin pesquisa-pantanal-extracao-2026
            git push origin HEAD:pesquisa-pantanal-extracao-2026
          fi
