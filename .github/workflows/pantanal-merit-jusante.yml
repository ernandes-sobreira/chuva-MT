name: Pantanal - diagnosticar drenagem MERIT Ressaca
on:
  push:
    branches: [pesquisa-pantanal-extracao-2026]
    paths:
      - 'pesquisa_pantanal/fazenda_ressaca/diagnosticar_jusante_merit.py'
      - '.github/workflows/pantanal-merit-jusante.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bibliotecas científicas
        run: python -m pip install --quiet earthengine-api numpy shapely
      - name: Raster MERIT 90m e traçado D8
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          EE_PROJECT: ${{ vars.EE_PROJECT }}
        run: python pesquisa_pantanal/fazenda_ressaca/diagnosticar_jusante_merit.py
      - name: Salvar diagnóstico georreferenciado em ramo de pesquisa
        if: always()
        run: |
          git config user.name "pantanal-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pesquisa_pantanal/fazenda_ressaca/jusante/
          if ! git diff --cached --quiet; then
            git commit -m "MERIT Hydro 90m D8: trajetos e conectividade exploratória"
            git pull --rebase origin pesquisa-pantanal-extracao-2026
            git push origin HEAD:pesquisa-pantanal-extracao-2026
          fi
