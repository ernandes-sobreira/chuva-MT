name: Pantanal - defasagens pastagem 0 a 10 anos
on:
  push:
    branches: [pesquisa-pantanal-extracao-2026]
    paths:
      - 'pesquisa_pantanal/recorte_cientifico/janelas_defasagens_analise.py'
      - '.github/workflows/pantanal-lag-pastagem.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analise_defasagens:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar bibliotecas gratuitas
        run: python -m pip install --quiet numpy pandas scipy statsmodels matplotlib
      - name: Testar lags anuais e janelas deslizantes
        run: python pesquisa_pantanal/recorte_cientifico/janelas_defasagens_analise.py
      - name: Gravar resultados científicos na ramificação isolada
        run: |
          git config user.name "pantanal-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pesquisa_pantanal/recorte_cientifico/janelas_defasagens/
          if ! git diff --cached --quiet; then
            git commit -m "Defasagens anuais e janelas movéis: gráficos e testes"
            git pull --rebase origin pesquisa-pantanal-extracao-2026
            git push origin HEAD:pesquisa-pantanal-extracao-2026
          fi
