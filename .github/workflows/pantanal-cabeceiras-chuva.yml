name: Pantanal - chuva das cabeceiras no exutório
on:
  push:
    branches: [pesquisa-pantanal-extracao-2026]
    paths:
      - 'pesquisa_pantanal/cabeceiras/chuva_bacias_verificadas.py'
      - '.github/workflows/pantanal-cabeceiras-chuva.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chuva:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Earth Engine
        run: python -m pip install --quiet earthengine-api
      - name: Validar exutórios ANA e extrair chuva CHIRPS
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          EE_PROJECT: ${{ vars.EE_PROJECT }}
        run: python pesquisa_pantanal/cabeceiras/chuva_bacias_verificadas.py
      - name: Salvar chuvas e auditoria espacial
        if: always()
        run: |
          git config user.name "pantanal-science-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pesquisa_pantanal/cabeceiras/resultados/PRECIPITACAO_CABECEIRAS_CHIRPS_1985_2025.csv || true
          git add -f pesquisa_pantanal/cabeceiras/resultados/AUDITORIA_BACIAS_CHUVA_ANA.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Chuva CHIRPS nas cabeceiras ANA com área hidrográfica verificada"
            git pull --rebase origin pesquisa-pantanal-extracao-2026
            git push origin HEAD:pesquisa-pantanal-extracao-2026
          fi
