name: Pantanal - series anuais e mensais do hotspot Ressaca
on:
  push:
    branches: [pesquisa-pantanal-extracao-2026]
    paths:
      - 'pesquisa_pantanal/fazenda_ressaca/serie_temporal.py'
      - '.github/workflows/pantanal-ressaca-serie.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bibliotecas de análise espacial
        run: python -m pip install earthengine-api shapely
      - name: Extrair MapBiomas e CHIRPS no hotspot
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          EE_PROJECT: ${{ vars.EE_PROJECT }}
        run: python pesquisa_pantanal/fazenda_ressaca/serie_temporal.py
      - name: Salvar dados independentes da base da plataforma
        if: always()
        run: |
          git config user.name "pantanal-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pesquisa_pantanal/fazenda_ressaca/resultados/SERIE_ANUAL_HOTSPOT_1985_2025.csv || true
          git add -f pesquisa_pantanal/fazenda_ressaca/resultados/SERIE_MENSAL_HOTSPOT_1985_2025.csv || true
          git add -f pesquisa_pantanal/fazenda_ressaca/resultados/STATUS_SERIE_HOTSPOT.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Serie anual e mensal hotspot Ressaca; pixel de conversao"
            git pull --rebase origin pesquisa-pantanal-extracao-2026
            git push origin HEAD:pesquisa-pantanal-extracao-2026
          fi
