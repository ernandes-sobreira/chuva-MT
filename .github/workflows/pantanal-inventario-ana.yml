name: Pantanal - inventario oficial estações cabeceiras
on:
  push:
    branches: [pesquisa-pantanal-extracao-2026]
    paths:
      - 'pesquisa_pantanal/cabeceiras/auditar_inventario_ana.py'
      - '.github/workflows/pantanal-inventario-ana.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inventario:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests
      - run: python pesquisa_pantanal/cabeceiras/auditar_inventario_ana.py
      - name: Salvar inventário em branch científica
        if: always()
        run: |
          git config user.name "pantanal-science-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pesquisa_pantanal/cabeceiras/resultados/INVENTARIO_ANA_CABECEIRAS.json
          if ! git diff --cached --quiet; then
            git commit -m "Metadados estações ANA cabeceiras"
            git pull --rebase origin pesquisa-pantanal-extracao-2026
            git push origin HEAD:pesquisa-pantanal-extracao-2026
          fi
