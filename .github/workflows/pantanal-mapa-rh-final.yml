name: Pantanal - mapa comparativo final RH ANA
on:
  push:
    branches: [pesquisa-pantanal-extracao-2026]
    paths:
      - 'pesquisa_pantanal/cartografia/mapa_rh_final.py'
      - '.github/workflows/pantanal-mapa-rh-final.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cartografia:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bibliotecas
        run: python -m pip install --quiet shapely matplotlib
      - name: Mapa com geometria oficial verificada
        run: python pesquisa_pantanal/cartografia/mapa_rh_final.py
      - name: Salvar mapa
        run: |
          git config user.name "pantanal-science-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pesquisa_pantanal/cartografia/MAPA_RH_PARAGUAI_E_EXUTORIO_CACERES_FINAL.png
          git commit -m "Mapa final RH Paraguai e bacia estacao Caceres"
          git pull --rebase origin pesquisa-pantanal-extracao-2026
          git push origin HEAD:pesquisa-pantanal-extracao-2026
