name: Pantanal - consulta SIGEF da Ressaca
on:
  push:
    branches: [pesquisa-pantanal-extracao-2026]
    paths:
      - 'pesquisa_pantanal/fazenda_ressaca/diagnostico_sigef.py'
      - '.github/workflows/pantanal-sigef-diag.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python pesquisa_pantanal/fazenda_ressaca/diagnostico_sigef.py
      - name: Save report
        if: always()
        run: |
          git config user.name "pantanal-science-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pesquisa_pantanal/fazenda_ressaca/DIAGNOSTICO_NOME_SIGEF.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Diagnostico do espelho SIGEF"
            git pull --rebase origin pesquisa-pantanal-extracao-2026
            git push origin HEAD:pesquisa-pantanal-extracao-2026
          fi
