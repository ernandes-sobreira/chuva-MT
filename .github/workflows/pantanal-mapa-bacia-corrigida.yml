name: Pantanal - mapa da bacia corrigida
on:
  push:
    branches: [pesquisa-pantanal-extracao-2026]
    paths:
      - 'pesquisa_pantanal/cartografia/plotar_recorte_validado.py'
      - '.github/workflows/pantanal-mapa-bacia-corrigida.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cartografia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar bibliotecas de mapas
        run: python -m pip install --quiet shapely matplotlib
      - name: Gerar mapa referenciado e auditado
        run: python pesquisa_pantanal/cartografia/plotar_recorte_validado.py
      - name: Gravar mapa no ramo cientifico
        run: |
          git config user.name "pantanal-science-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pesquisa_pantanal/cartografia/MAPA_BACIA_REAL_ESTACAO_CACERES_BIOMAS.png
          git commit -m "Mapa cientifico da bacia real upstream 66070004"
          git push origin HEAD:pesquisa-pantanal-extracao-2026
