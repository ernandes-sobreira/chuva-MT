name: Pantanal - frequencia de agua por pixel
on:
  push:
    branches: [pesquisa-pantanal-extracao-2026]
    paths:
      - 'pesquisa_pantanal/fazenda_ressaca/mapear_frequencia_pixel.py'
      - '.github/workflows/pantanal-hidroperiodo-pixel.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mapear:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet earthengine-api numpy matplotlib shapely pyproj
      - name: Calcular frequência mensal MapBiomas por pixel 30m
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          EE_PROJECT: ${{ vars.EE_PROJECT }}
        run: python pesquisa_pantanal/fazenda_ressaca/mapear_frequencia_pixel.py
      - name: Salvar resultados de pixels
        if: always()
        run: |
          git config user.name "pantanal-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pesquisa_pantanal/fazenda_ressaca/jusante/STATUS_HIDROPERIODO_PIXELS.json || true
          git add -f pesquisa_pantanal/fazenda_ressaca/jusante/MAPA_DELTA_FREQUENCIA_AGUA_PIXELS_1985_2025.png || true
          if ! git diff --cached --quiet; then
            git commit -m "Mudança frequência de água por pixel: período antes e depois"
            git pull --rebase origin pesquisa-pantanal-extracao-2026
            git push origin HEAD:pesquisa-pantanal-extracao-2026
          fi
