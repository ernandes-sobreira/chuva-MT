name: Pantanal - perímetro oficial Fazenda Ressaca
on:
  push:
    branches: [pesquisa-pantanal-extracao-2026]
    paths:
      - 'pesquisa_pantanal/fazenda_ressaca/extrair_perimetro_sigef.py'
      - '.github/workflows/pantanal-fazenda-sigef.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validar_fazenda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bibliotecas geoespaciais
        run: python -m pip install --quiet requests shapely pyproj
      - name: Conferir perímetro oficial da fazenda
        run: python pesquisa_pantanal/fazenda_ressaca/extrair_perimetro_sigef.py
      - name: Guardar perímetros e metadados na ramificação científica
        if: always()
        run: |
          git config user.name "pantanal-science-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pesquisa_pantanal/fazenda_ressaca/*.geojson pesquisa_pantanal/fazenda_ressaca/AUDITORIA_PERIMETRO_SIGEF.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Geometrias verificadas ou relatório de falha da Fazenda Ressaca"
            git pull --rebase origin pesquisa-pantanal-extracao-2026
            git push origin HEAD:pesquisa-pantanal-extracao-2026
          fi
