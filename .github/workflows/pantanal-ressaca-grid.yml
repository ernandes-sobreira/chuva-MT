name: Pantanal - triagem pixel de pastagens Ressaca
on:
  push:
    branches: [pesquisa-pantanal-extracao-2026]
    paths:
      - 'pesquisa_pantanal/fazenda_ressaca/triar_grid_2km.py'
      - '.github/workflows/pantanal-ressaca-grid.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  triar:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Earth Engine, PROJ
        run: python -m pip install --quiet earthengine-api pyproj
      - name: Mapear conversão 1985 a 2025 na grade de 2 km
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          EE_PROJECT: ${{ vars.EE_PROJECT }}
        run: python pesquisa_pantanal/fazenda_ressaca/triar_grid_2km.py
      - name: Salvar grade e resultados sem alterar o Chuva-MT publicado
        if: always()
        run: |
          git config user.name "pantanal-science-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pesquisa_pantanal/fazenda_ressaca/resultados/
          if ! git diff --cached --quiet; then
            git commit -m "Triagem de conversão para pastagens Ressaca - grade 2km"
            git pull --rebase origin pesquisa-pantanal-extracao-2026
            git push origin HEAD:pesquisa-pantanal-extracao-2026
          fi
