name: Pantanal - RH Paraguai oficial ANA
on:
  push:
    branches: [pesquisa-pantanal-extracao-2026]
    paths:
      - 'pesquisa_pantanal/recorte_cientifico/obter_rh_paraguai.py'
      - '.github/workflows/pantanal-rh-ana.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rh_ana:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias cartograficas
        run: python -m pip install --quiet requests pyshp shapely pyproj matplotlib
      - name: Recorte RH Paraguai via ANA e bioma IBGE
        run: python pesquisa_pantanal/recorte_cientifico/obter_rh_paraguai.py
      - name: Salvar limites oficiais e mapa comparativo
        if: always()
        run: |
          git config user.name "pantanal-science-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pesquisa_pantanal/recorte_cientifico/resultados/STATUS_RH_PARAGUAI_ANA.json || true
          git add -f pesquisa_pantanal/recorte_cientifico/resultados/RH_PARAGUAI_Brasil_ANA.geojson || true
          git add -f pesquisa_pantanal/recorte_cientifico/resultados/Pantanal_bioma_dentro_RH_Paraguai_IBGE.geojson || true
          git add -f pesquisa_pantanal/cartografia/MAPA_BAP_ANA_VS_BACIA_CACERES.png || true
          if ! git diff --cached --quiet; then
            git commit -m "RH Paraguai ANA e mapa comparativo do recorte de Caceres"
            git pull --rebase origin pesquisa-pantanal-extracao-2026
            git push origin HEAD:pesquisa-pantanal-extracao-2026
          fi
