name: Pantanal - robustez das pastagens
on:
  push:
    branches: [pesquisa-pantanal-extracao-2026]
    paths:
      - 'pesquisa_pantanal/hidrologia/testar_robustez_pastagens.py'
      - '.github/workflows/pantanal-robustez.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sensibilidade e validacao hidrologica
        run: |
          python -m pip install --quiet numpy pandas scipy statsmodels matplotlib
          python pesquisa_pantanal/hidrologia/testar_robustez_pastagens.py
      - name: Publicar resultados em ramo de pesquisa
        run: |
          git config user.name "pantanal-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pesquisa_pantanal/hidrologia/analise/
          if ! git diff --cached --quiet; then
            git commit -m "Auditoria sensibilidade pastagem e hidrologia"
            git push origin HEAD:pesquisa-pantanal-extracao-2026
          fi
