name: Pantanal - tendencias de vazao das cabeceiras
on:
  push:
    branches: [pesquisa-pantanal-extracao-2026]
    paths:
      - 'pesquisa_pantanal/cabeceiras/analisar_estacoes.py'
      - '.github/workflows/pantanal-vazao-seca.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hidrologia:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bibliotecas estatísticas
        run: python -m pip install --quiet numpy pandas scipy statsmodels matplotlib
      - name: Vazão seca, Q90 e tendências Theil Sen
        run: python pesquisa_pantanal/cabeceiras/analisar_estacoes.py
      - name: Salvar resultados somente na pesquisa
        if: always()
        run: |
          git config user.name "pantanal-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pesquisa_pantanal/cabeceiras/resultados/
          if ! git diff --cached --quiet; then
            git commit -m "Vazão na estiagem e Q90 das cabeceiras com IC95"
            git pull --rebase origin pesquisa-pantanal-extracao-2026
            git push origin HEAD:pesquisa-pantanal-extracao-2026
          fi
