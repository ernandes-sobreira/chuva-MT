name: Pantanal - analise reprocessada bacia validada
on:
  push:
    branches: [pesquisa-pantanal-extracao-2026]
    paths:
      - 'pesquisa_pantanal/recorte_cientifico/analisar_nova_bacia.py'
      - '.github/workflows/pantanal-analise-reprocessada.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ciencia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Estatistica observacional e graficos
        run: |
          python -m pip install --quiet numpy pandas scipy statsmodels matplotlib
          python pesquisa_pantanal/recorte_cientifico/analisar_nova_bacia.py
      - name: Salvar resultados validados de forma isolada
        run: |
          git config user.name "pantanal-science-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pesquisa_pantanal/recorte_cientifico/analise/
          if ! git diff --cached --quiet; then
            git commit -m "Estatisticas e graficos do novo recorte hidrográfico ANA 66070004"
            git pull --rebase origin pesquisa-pantanal-extracao-2026
            git push origin HEAD:pesquisa-pantanal-extracao-2026
          fi
