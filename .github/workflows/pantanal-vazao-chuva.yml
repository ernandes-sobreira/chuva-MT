name: Pantanal - chuva x vazao seca cabeceiras
on:
  push:
    branches: [pesquisa-pantanal-extracao-2026]
    paths:
      - 'pesquisa_pantanal/cabeceiras/analisar_chuva_vs_vazao.py'
      - '.github/workflows/pantanal-vazao-chuva.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy pandas scipy statsmodels matplotlib
      - name: Qseca normalizada por area, chuva antecedente e trend residual
        run: python pesquisa_pantanal/cabeceiras/analisar_chuva_vs_vazao.py
      - name: Publicar diagnóstico reprodutível
        if: always()
        run: |
          git config user.name "pantanal-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pesquisa_pantanal/cabeceiras/resultados/
          if ! git diff --cached --quiet; then
            git commit -m "Teste vazao seca contra chuva a montante, 1985 a 2025"
            git pull --rebase origin pesquisa-pantanal-extracao-2026
            git push origin HEAD:pesquisa-pantanal-extracao-2026
          fi
