name: Pesquisa Pantanal - extracao oficial
on:
  push:
    branches: [pesquisa-pantanal-extracao-2026]
    paths:
      - 'pesquisa_pantanal/extrair.py'
      - '.github/workflows/pantanal-extracao.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extracao:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar bibliotecas gratuitas
        run: python -m pip install requests openpyxl
      - name: Extrair agua MapBiomas e rebanho SIDRA
        run: python pesquisa_pantanal/extrair.py
      - name: Salvar resultados apenas neste ramo
        if: always()
        run: |
          git config user.name "pantanal-extracao-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pesquisa_pantanal/resultados || true
          if ! git diff --cached --quiet; then
            git commit -m "Dados observados: extração MapBiomas e SIDRA"
            git push origin HEAD:pesquisa-pantanal-extracao-2026
          fi
