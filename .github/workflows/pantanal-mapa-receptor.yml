name: Pantanal - mapa receptor e controles
on:
  push:
    branches: [pesquisa-pantanal-extracao-2026]
    paths:
      - 'pesquisa_pantanal/fazenda_ressaca/plotar_receptor_controles.py'
      - '.github/workflows/pantanal-mapa-receptor.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  figura:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet shapely pyproj pillow matplotlib
      - name: Cartografia dos recortes
        run: python pesquisa_pantanal/fazenda_ressaca/plotar_receptor_controles.py
      - name: Salvar mapa no ramo de pesquisa
        run: |
          git config user.name "pantanal-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pesquisa_pantanal/fazenda_ressaca/jusante/MAPA_PILOTO_JUSANTE_E_CONTROLES.png
          git commit -m "Mapa fonte, receptor e controles Ressaca"
          git pull --rebase origin pesquisa-pantanal-extracao-2026
          git push origin HEAD:pesquisa-pantanal-extracao-2026
