name: Pesquisa Pantanal Caceres - prancha mapas reais
on:
  push:
    branches: [pesquisa-pantanal-extracao-2026]
    paths:
      - 'pesquisa_pantanal/cartografia/*.py'
      - '.github/workflows/pantanal-prancha.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cartografia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Montar figura com imagens oficiais
        run: python pesquisa_pantanal/cartografia/montar_prancha.py
      - name: Salvar figura em ramo isolado
        run: |
          git config user.name "pantanal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pesquisa_pantanal/cartografia/PRANCHA_MAPAS_REAIS_CACERES_1988_2024.png
          git commit -m "Prancha oficial MapBiomas Caceres 1988 e 2024"
          git push origin HEAD:pesquisa-pantanal-extracao-2026
